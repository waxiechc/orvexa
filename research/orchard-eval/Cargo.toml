[package]
name = "orchard-eval"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "Isolated P1 evaluation stand for the orchard crate. Not part of the ORVEXA v1 workspace."

# Empty workspace table: this stand never joins or edits the v1 Cargo.lock.
[workspace]

[dependencies]
orchard = { version = "=0.16.0", default-features = false, features = ["std", "circuit", "multicore"] }
shardtree = "0.8"
incrementalmerkletree = "0.9"
zcash_note_encryption = "=0.5.1"
rand = { version = "0.10", features = ["std", "sys_rng"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
debug = false
