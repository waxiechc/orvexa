name: Сообщить об ошибке
description: Ошибка предварительной версии ORVEXA. Не прикладывайте секреты.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Что произошло?
      description: Ожидаемый результат, фактический результат и шаги воспроизведения.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия и операционная система
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Диагностика без секретов
      description: Без файлов кошелька, seed-фраз, паролей и credentials.
